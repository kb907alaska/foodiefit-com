<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="redSpotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#EF5454"/>
    </linearGradient>
  </defs>
  
  <!-- Logo Icon: Stylized Meal Bowl & Fresh Leaf with RED Spot Accent -->
  <g transform="translate(10, 10)">
    <!-- Bowl Base -->
    <path d="M 12 35 C 12 58, 32 68, 48 68 C 64 68, 84 58, 84 35 Z" fill="url(#redSpotGrad)" />
    <!-- Steam / Fresh Accent Leaf with Red Spot Color -->
    <path d="M 48 10 C 60 5, 72 15, 68 28 C 55 28, 48 18, 48 10 Z" fill="#FF4D4D" />
    <path d="M 40 16 C 30 12, 20 20, 26 30 C 35 30, 40 22, 40 16 Z" fill="#EF5454" opacity="0.9" />
  </g>

  <!-- Typography: FOODIE FIT with Red Spot Color on FIT and Accent Dots -->
  <text x="105" y="52" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="0.5" fill="#FFFFFF">
    FOODIE <tspan fill="#EF5454">FIT</tspan>
  </text>
  <text x="106" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="4" fill="#A1A1AA">
    MEAL PREP • LAS VEGAS
  </text>

  <!-- Red Spot Dot -->
  <circle cx="340" cy="44" r="5" fill="#EF5454" />
</svg>